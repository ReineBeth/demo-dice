<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Un simulateur de lancer de dés à douze faces.">
    <title>Simulateur de dés</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="dice-page">
      <section class="dice-panel" aria-labelledby="page-title">
        <p class="eyebrow">Dé à 12 faces</p>
        <h1 id="page-title">Simulateur de dés</h1>
        <p class="intro">Lance le dé et découvre le symbole obtenu.</p>

        <div class="dice-groups" data-dice-groups></div>

        <section class="general-actions" aria-labelledby="general-actions-title">
          <h2 class="visually-hidden" id="general-actions-title">Actions générales</h2>
          <button class="general-action-button" id="export-settings" type="button">
            Exporter les paramètres en CSV
          </button>
          <button class="general-action-button" id="import-settings" type="button">
            Importer un CSV
          </button>
          <input
            class="visually-hidden"
            id="import-settings-file"
            type="file"
            accept=".csv,text/csv"
          >
          <button class="general-action-button" id="save-settings" type="button">
            Sauvegarder les paramètres
          </button>
          <p class="general-actions-status" id="general-actions-status" aria-live="polite"></p>
        </section>
      </section>
    </main>

    <template id="result-template">
      <p class="result" aria-live="polite">Aucun lancer pour le moment.</p>
    </template>

    <script src="script.js" defer></script>
  </body>
</html>
