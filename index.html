<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Un simulateur de lancer de dé à douze faces.">
    <title>Simulateur de dé</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="dice-page">
      <section class="dice-panel" aria-labelledby="page-title">
        <p class="eyebrow">Dé à 12 faces</p>
        <h1 id="page-title">Simulateur de dé</h1>
        <p class="intro">Lance le dé et découvre le symbole obtenu.</p>

        <section class="maneuver-control" aria-labelledby="maneuver-title">
          <h2 id="maneuver-title">Manoeuvrabilité</h2>

          <label class="rating-field" for="maneuver-rating">
            Niveau
            <select id="maneuver-rating" name="maneuver-rating">
              <option value="-">-</option>
              <option value="★">★</option>
              <option value="★★">★★</option>
              <option value="★★★">★★★</option>
              <option value="S">S</option>
            </select>
          </label>

          <fieldset class="operator-field">
            <legend>Modification</legend>
            <div class="segmented-control">
              <label>
                <input type="radio" name="maneuver-operator" value="+">
                <span>+</span>
              </label>
              <label>
                <input type="radio" name="maneuver-operator" value="=" checked>
                <span>=</span>
              </label>
              <label>
                <input type="radio" name="maneuver-operator" value="-">
                <span>-</span>
              </label>
            </div>
          </fieldset>
        </section>

        <div class="dice-stage">
          <div
            class="die"
            id="die"
            role="img"
            aria-label="Dé prêt à être lancé"
          >
            <span class="die-face" id="die-face" aria-hidden="true"></span>
          </div>
        </div>

        <p class="result" id="result" aria-live="polite">Aucun lancer pour le moment.</p>
        <button class="roll-button" id="roll-button" type="button">
          Lancer le dé
        </button>
      </section>
    </main>

    <script src="script.js" defer></script>
  </body>
</html>
